<div class="fixed bottom-4 right-4 md:bottom-8 md:right-8 z-[200] font-inter">
  
  <button (click)="toggleChat()" 
          class="w-14 h-14 md:w-16 md:h-16 bg-blue-600 rounded-[1.8rem] md:rounded-[2rem] shadow-[0_20px_50px_rgba(37,99,235,0.4)] flex items-center justify-center hover:scale-110 active:scale-95 transition-all text-white border-4 border-white">
    <lucide-icon *ngIf="!isOpen" [img]="Bot" [size]="24"></lucide-icon>
    <lucide-icon *ngIf="isOpen" [img]="X" [size]="24" class="font-black"></lucide-icon>
  </button>

  <div *ngIf="isOpen" 
       class="absolute bottom-20 md:bottom-24 right-0 w-[calc(100vw-2rem)] sm:w-[420px] h-[500px] md:h-[650px] max-h-[calc(100vh-140px)] bg-white rounded-[2rem] md:rounded-[3rem] shadow-[0_35px_80px_rgba(0,0,0,0.25)] border border-slate-100 flex flex-col overflow-hidden animate-in fade-in slide-in-from-bottom-12 duration-500">
    
    <div class="p-5 md:p-8 bg-slate-900 text-white flex items-center justify-between shrink-0">
      <div class="flex items-center gap-3 md:gap-4">
        <div class="w-10 h-10 md:w-12 md:h-12 bg-blue-600 rounded-xl md:rounded-2xl flex items-center justify-center shadow-inner shadow-blue-400">
          <img src="assets/images/logo.jpeg" class="w-10 h-10 md:w-12 md:h-12 rounded-xl md:rounded-2xl object-cover" alt="EduBridge">
        </div>
        <div>
          <p class="text-[9px] md:text-[10px] font-black uppercase tracking-[0.2em] text-blue-400 leading-none mb-1">EduBridge AI</p>
          <p class="text-xs md:text-sm font-bold opacity-90 italic">Asistente de {{ user?.name || 'Estudiante' }}</p>
        </div>
      </div>
      <div class="flex items-center gap-2 bg-slate-800 px-2.5 py-1 md:px-3 md:py-1.5 rounded-full">
        <div class="w-1.5 h-1.5 md:w-2 md:h-2 bg-emerald-500 rounded-full animate-pulse"></div>
        <span class="text-[8px] md:text-[9px] font-black text-emerald-500 uppercase tracking-widest">Online</span>
      </div>
    </div>

    <div id="chat-box" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4 md:space-y-6 bg-slate-50/50 scroll-smooth relative z-10">
      <div class="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none overflow-hidden">
        <img src="assets/images/logo.jpeg" class="w-48 h-48 object-contain" alt="">
      </div>
      <div *ngFor="let msg of chatMessages" 
           [ngClass]="msg.role === 'assistant' ? 'justify-start' : 'justify-end'" 
           class="flex w-full message-fade-in relative z-10">
      
        <div [ngClass]="msg.role === 'assistant' 
                ? 'bg-white text-slate-700 rounded-tr-[1.5rem] md:rounded-tr-[1.8rem] rounded-bl-[1.5rem] md:rounded-bl-[1.8rem] rounded-br-[1.5rem] md:rounded-br-[1.8rem] shadow-sm border border-slate-200' 
                : 'bg-blue-600 text-white rounded-tl-[1.5rem] md:rounded-tl-[1.8rem] rounded-bl-[1.5rem] md:rounded-bl-[1.8rem] rounded-br-[1.5rem] md:rounded-br-[1.8rem] shadow-blue-200 shadow-lg'"
             class="max-w-[90%] md:max-w-[88%] p-4 md:p-5 text-[12px] md:text-[13px] font-medium leading-relaxed tracking-tight message-content">
          
          <div [innerHTML]="msg.content"></div>
        </div>
      </div>

      <div *ngIf="loading" class="flex justify-start animate-pulse relative z-10">
        <div class="bg-white p-3 md:p-4 rounded-2xl shadow-sm border border-slate-100 flex gap-2">
          <div class="w-1.5 h-1.5 md:w-2 md:h-2 bg-blue-600 rounded-full animate-bounce [animation-duration:0.6s]"></div>
          <div class="w-1.5 h-1.5 md:w-2 md:h-2 bg-blue-600 rounded-full animate-bounce [animation-duration:0.6s] [animation-delay:0.2s]"></div>
          <div class="w-1.5 h-1.5 md:w-2 md:h-2 bg-blue-600 rounded-full animate-bounce [animation-duration:0.6s] [animation-delay:0.4s]"></div>
        </div>
      </div>
    </div>

    <div class="p-4 md:p-6 bg-white border-t border-slate-100 shrink-0">
      <form (ngSubmit)="enviarMensaje()" class="relative flex items-center gap-2 md:gap-3">
        <input type="text" name="msg" [(ngModel)]="mensajeUser"
               placeholder="Escribe tu duda aquí..." 
               class="flex-1 bg-slate-100 border-none p-3 md:p-4 rounded-xl md:rounded-2xl text-[12px] md:text-[13px] font-semibold text-slate-700 outline-none focus:ring-2 focus:ring-blue-500/20 focus:bg-white transition-all shadow-inner" />
        
        <button type="submit" 
                [disabled]="!mensajeUser.trim() || loading"
                class="w-10 h-10 md:w-12 md:h-12 bg-blue-600 text-white rounded-xl md:rounded-2xl flex items-center justify-center hover:bg-blue-700 transition-all active:scale-90 disabled:opacity-30 shadow-lg shadow-blue-200">
          <lucide-icon [img]="Send" [size]="18" class="md:text-xl"></lucide-icon>
        </button>
      </form>
      <div class="mt-3 md:mt-4 flex items-center justify-center gap-2 grayscale opacity-30">
        <p class="text-[7px] md:text-[8px] font-black uppercase tracking-[0.3em] text-slate-500 text-center">
          Powered by Gemini 3 Flash for EduBridge
        </p>
      </div>
    </div>
  </div>
</div>
