<div class="relative inline-block overflow-visible font-inter">
  <div (click)="toggleDropdown()"
    class="relative cursor-pointer hover:scale-110 active:scale-95 transition-all p-2 z-[70]">
    <lucide-icon [img]="Bell" [size]="22"></lucide-icon>
    <span *ngIf="notifications.length > 0"
      class="absolute top-1 right-1 w-5 h-5 bg-blue-600 text-white text-[10px] font-black rounded-full border-2 border-white flex items-center justify-center animate-bounce shadow-lg">
      {{notifications.length}}
    </span>
  </div>

  <ng-container *ngIf="isOpen">
    <div class="fixed inset-0 z-[80] bg-transparent" (click)="isOpen = false"></div>

    <div
      class="fixed md:absolute right-4 md:right-0 mt-4 w-[calc(100vw-2rem)] sm:w-80 md:w-96 bg-white rounded-[2rem] md:rounded-[2.5rem] shadow-[0_25px_60px_rgba(0,0,0,0.15)] border border-slate-100 z-[100] overflow-hidden animate-in fade-in zoom-in-95 duration-300 origin-top-right text-left">

      <div class="p-5 md:p-8 border-b border-slate-50 bg-white flex justify-between items-center">
        <h3
          class="font-black text-slate-900 text-[10px] md:text-[11px] uppercase tracking-[0.2em] md:tracking-[0.25em] italic">
          Buzón de Avisos</h3>
        <span class="bg-blue-50 text-blue-600 px-2.5 py-1 rounded-full text-[8px] md:text-[9px] font-black uppercase">
          {{notifications.length}} <span class="hidden sm:inline">Pendientes</span>
        </span>
      </div>

      <div class="max-h-[60vh] md:max-h-[420px] overflow-y-auto custom-scrollbar bg-white">
        <ng-container *ngIf="notifications.length > 0; else noNotifs">

          <div *ngFor="let notif of notifications"
            class="p-4 md:p-6 border-b border-slate-50 hover:bg-slate-50/50 transition-all group relative">
            <div class="flex gap-3 md:gap-5">

              <div [ngClass]="{
                'bg-rose-100 text-rose-600': notif.type === 'RIESGO',
                'bg-amber-100 text-amber-600': notif.type === 'EXAMEN',
                'bg-blue-100 text-blue-600': notif.type === 'TAREA',
                'bg-emerald-100 text-emerald-600': notif.type === 'FELICITACION'
              }"
                class="w-10 h-10 md:w-12 md:h-12 rounded-xl md:rounded-2xl flex items-center justify-center shrink-0 shadow-sm transition-transform group-hover:scale-110">
                <lucide-icon *ngIf="notif.type === 'RIESGO'" [img]="AlertTriangle" [size]="18"
                  class="md:text-xl"></lucide-icon>
                <lucide-icon *ngIf="notif.type === 'EXAMEN'" [img]="FileText" [size]="18"
                  class="md:text-xl"></lucide-icon>
                <lucide-icon *ngIf="notif.type === 'TAREA'" [img]="FolderOpen" [size]="18"
                  class="md:text-xl"></lucide-icon>
                <lucide-icon *ngIf="notif.type === 'FELICITACION'" [img]="Sparkles" [size]="18"
                  class="md:text-xl"></lucide-icon>
                <lucide-icon *ngIf="!['RIESGO','EXAMEN','TAREA','FELICITACION'].includes(notif.type)" [img]="Volume2"
                  [size]="18" class="md:text-xl"></lucide-icon>
              </div>

              <div class="flex-1 min-w-0">
                <div class="flex justify-between items-start mb-1">
                  <span class="text-[8px] md:text-[9px] font-black text-slate-400 uppercase tracking-widest">
                    {{notif.type || 'AVISO'}}
                  </span>
                  <span class="text-[8px] font-bold text-slate-300">AHORA</span>
                </div>

                <p class="text-[10px] md:text-xs font-bold text-slate-700 leading-relaxed mb-3 md:mb-4 break-words">
                  {{notif.content || notif.message}}
                </p>

                <button (click)="confirmarLectura(notif.id)"
                  class="flex items-center gap-2 text-[8px] md:text-[9px] font-black text-blue-600 uppercase tracking-widest hover:text-emerald-500 transition-all">
                  Confirmar <span class="hidden sm:inline">Recepción</span> <lucide-icon [img]="Check" [size]="12"
                    class="text-xs"></lucide-icon>
                </button>
              </div>
            </div>
          </div>

        </ng-container>

        <ng-template #noNotifs>
          <div class="p-10 md:p-16 text-center">
            <div
              class="w-16 h-16 md:w-20 md:h-20 bg-slate-50 rounded-full flex items-center justify-center mx-auto mb-4 md:mb-6">
              <lucide-icon [img]="Sparkles" [size]="28" class="md:text-4xl opacity-40"></lucide-icon>
            </div>
            <p class="text-[9px] md:text-[11px] font-black text-slate-400 uppercase tracking-[0.2em] italic">Todo al día
            </p>
          </div>
        </ng-template>
      </div>

      <div class="p-4 md:p-6 bg-slate-50/50 border-t border-slate-100 text-center">
        <button
          class="text-[8px] md:text-[9px] font-black text-slate-400 uppercase tracking-[0.2em] md:tracking-[0.3em] hover:text-blue-600 transition-all">
          Ver Historial <span class="hidden xs:inline">Completo</span>
        </button>
      </div>
    </div>
  </ng-container>
</div>
